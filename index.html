<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="My Pages">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>My Pages</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <p class="eyebrow">YOUR PERSONAL APP SPACE</p>
        <h1>My Pages</h1>
        <p class="intro">Small, personal apps. Open one in Safari and add it to your Home Screen.</p>
      </header>

      <nav class="app-list" aria-label="Your apps">
        <a class="app-card" href="fake-wechat/">
          <span class="app-icon app-icon-chat" aria-hidden="true">聊</span>
          <span class="app-copy">
            <strong>Fake WeChat</strong>
            <span>A starter page for your chat app idea</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a class="app-card" href="solo-dev/">
          <span class="app-icon app-icon-dev" aria-hidden="true">&lt;/&gt;</span>
          <span class="app-copy">
            <strong>Solo Dev</strong>
            <span>A starter page for your developer tools</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </nav>

      <p class="hint">Tip: In Safari, tap Share, then “Add to Home Screen.”</p>
    </main>
  </body>
</html>
